name: iOS TestFlight Algeciras CF Abonados

on:
  workflow_dispatch:
  push:
    branches: [master, main]

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  build:
    name: Build & Submit to TestFlight
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Ruby 3.2
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install Node deps
        run: npm install --no-audit --no-fund

      - name: Install Fastlane
        run: gem install fastlane -NV

      - name: Decode App Store Connect API Key
        env:
          ASC_API_KEY_P8_B64: ${{ secrets.ASC_API_KEY_P8_B64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p $HOME/private_keys
          echo "$ASC_API_KEY_P8_B64" | base64 --decode > $HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8
          ls -la $HOME/private_keys/

      - name: Expo Prebuild
        env:
          EXPO_NO_TELEMETRY: '1'
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods
        working-directory: ios
        run: pod install --repo-update

      - name: Build and Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_BUNDLE_ID: es.algecirascf.abonos
          ASC_API_KEY_PATH: ${{ format('{0}/private_keys/AuthKey_{1}.p8', github.workspace, secrets.ASC_KEY_ID) }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
        run: |
          export ASC_API_KEY_PATH="$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          bundle exec fastlane ios beta || fastlane ios beta

      - name: Upload ipa
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AlgecirasCFAbonados-ipa
          path: ios/build/*.ipa
          retention-days: 14

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            ios/build/**/*.log
            ~/Library/Logs/gym/*
            fastlane/report.xml
          retention-days: 7
          if-no-files-found: ignore
